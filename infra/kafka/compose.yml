# =============================================================================
#  VidaSalud - Arquitectura Kafka: 3 Zookeeper + 3 Brokers + Kafka UI
#  EP5 / DSY1107 - Desarrollo Cloud Native I
# -----------------------------------------------------------------------------
#  Topología:
#     zookeeper1/2/3  -> ensemble (quórum de 3 nodos)      puertos 2181/2182/2183
#     kafka1/2/3      -> brokers (replication factor 3)    puertos 29092/29093/29094
#     kafka-ui        -> interfaz web de administración     puerto  8090
#
#  Cada broker expone dos listeners:
#     INTERNAL (kafkaN:9092)  -> usado dentro de la red Docker (microservicios)
#     EXTERNAL (localhost:2909N) -> usado desde el host (aplicaciones locales)
#
#  Uso:
#     docker compose -f infra/kafka/compose.yml up -d
#     docker compose -f infra/kafka/compose.yml ps
#     docker compose -f infra/kafka/compose.yml down
#     docker compose -f infra/kafka/compose.yml down -v
#
#  Kafka UI:  http://localhost:8090
# =============================================================================

name: vidasalud-kafka

# -----------------------------------------------------------------------------
#  Plantillas reutilizables (extension fields, no son servicios)
# -----------------------------------------------------------------------------
x-zk-common: &zk-common
  image: zookeeper:3.9
  restart: unless-stopped
  environment:
    ZOO_TICK_TIME: "2000"
    ZOO_INIT_LIMIT: "10"
    ZOO_SYNC_LIMIT: "5"
    ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok,mntr"
    # Miembros del ensemble: id=host:puerto_eleccion:puerto_quorum;puerto_cliente
    ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181"
  networks:
    - vidasalud-net

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  depends_on:
    - zookeeper1
    - zookeeper2
    - zookeeper3
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092"
    # Requisitos de replicación (clúster de 3 brokers)
    KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
    KAFKA_NUM_PARTITIONS: "3"
    KAFKA_MIN_INSYNC_REPLICAS: "2"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    # Los tópicos se crean exclusivamente desde el microservicio administrador
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_DELETE_TOPIC_ENABLE: "true"
    KAFKA_LOG_RETENTION_HOURS: "168"
    KAFKA_LOG_SEGMENT_BYTES: "1073741824"
    KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
  networks:
    - vidasalud-net

services:

  # ---------------------------------------------------------------------------
  # ENSEMBLE ZOOKEEPER (3 nodos)
  # ---------------------------------------------------------------------------
  zookeeper1:
    <<: *zk-common
    container_name: vidasalud-zookeeper1
    hostname: zookeeper1
    environment:
      ZOO_MY_ID: "1"
      ZOO_TICK_TIME: "2000"
      ZOO_INIT_LIMIT: "10"
      ZOO_SYNC_LIMIT: "5"
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok,mntr"
      ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper1-data:/data

  zookeeper2:
    <<: *zk-common
    container_name: vidasalud-zookeeper2
    hostname: zookeeper2
    environment:
      ZOO_MY_ID: "2"
      ZOO_TICK_TIME: "2000"
      ZOO_INIT_LIMIT: "10"
      ZOO_SYNC_LIMIT: "5"
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok,mntr"
      ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181"
    ports:
      - "2182:2181"
    volumes:
      - zookeeper2-data:/data

  zookeeper3:
    <<: *zk-common
    container_name: vidasalud-zookeeper3
    hostname: zookeeper3
    environment:
      ZOO_MY_ID: "3"
      ZOO_TICK_TIME: "2000"
      ZOO_INIT_LIMIT: "10"
      ZOO_SYNC_LIMIT: "5"
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok,mntr"
      ZOO_SERVERS: "server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181"
    ports:
      - "2183:2181"
    volumes:
      - zookeeper3-data:/data

  # ---------------------------------------------------------------------------
  # BROKERS KAFKA (3 nodos)
  # ---------------------------------------------------------------------------
  kafka1:
    <<: *kafka-common
    container_name: vidasalud-kafka1
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:9092,EXTERNAL://localhost:29092"
    ports:
      - "29092:29092"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    container_name: vidasalud-kafka2
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:9092,EXTERNAL://localhost:29093"
    ports:
      - "29093:29092"
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    container_name: vidasalud-kafka3
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka3:9092,EXTERNAL://localhost:29094"
    ports:
      - "29094:29092"
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # ---------------------------------------------------------------------------
  # KAFKA UI (administración web de brokers, tópicos y consumer groups)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vidasalud-kafka-ui
    hostname: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vidasalud-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper1:2181"
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - vidasalud-net

volumes:
  zookeeper1-data:
    name: vidasalud-zookeeper1-data
  zookeeper2-data:
    name: vidasalud-zookeeper2-data
  zookeeper3-data:
    name: vidasalud-zookeeper3-data
  kafka1-data:
    name: vidasalud-kafka1-data
  kafka2-data:
    name: vidasalud-kafka2-data
  kafka3-data:
    name: vidasalud-kafka3-data

networks:
  # Misma red común declarada en infra/mq y en infra/apps.
  vidasalud-net:
    name: vidasalud-net
    driver: bridge
