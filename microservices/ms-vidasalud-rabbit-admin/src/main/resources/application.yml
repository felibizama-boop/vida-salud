server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: ms-vidasalud-rabbit-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # Credenciales del clúster definido en infra/mq/compose.yml.
    username: ${RABBITMQ_USER:vidasalud}
    password: ${RABBITMQ_PASS:vidasalud}

vidasalud:
  rabbitmq:
    management:
      base-url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
      username: ${RABBITMQ_USER:vidasalud}
      password: ${RABBITMQ_PASS:vidasalud}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
